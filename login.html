<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina • Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root { --gold:#D4AF37; }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:Inter, sans-serif;
      background:#0a1428;
      color:#e0e7ff;
      min-height:100vh;
      padding:24px;
    }

    .browser {
      max-width:900px;
      margin:auto;
      background:#1e2937;
      border-radius:22px;
      box-shadow:0 30px 90px rgba(0,0,0,.75);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
    }

    .title-bar {
      height:46px;
      background:#1e2937;
      display:flex;
      align-items:center;
      padding:0 18px;
      gap:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .dot { width:13px; height:13px; border-radius:50%; }
    .red { background:#ff5f57; }
    .yellow { background:#ffbd2e; }
    .green { background:#27c93f; }

    .page {
      position:relative;
      min-height:88vh;
      padding:90px 24px;
      background:#0a1428;
      overflow:hidden;
    }

    .page::before {
      content:"";
      position:absolute;
      inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(24px) brightness(.42);
      transform:scale(1.15);
      z-index:1;
    }

    .page > * { position:relative; z-index:2; }

    .nav {
      position:absolute;
      top:24px;
      right:28px;
      z-index:5;
      display:flex;
      gap:16px;
    }

    .nav a {
      color:#e0e7ff;
      text-decoration:none;
      font-weight:600;
    }

    .nav a:hover { color:var(--gold); }

    .form-box {
      max-width:500px;
      margin:auto;
      background:rgba(15,23,42,.9);
      backdrop-filter:blur(20px);
      border:1px solid rgba(212,175,55,.35);
      border-radius:28px;
      padding:48px;
      box-shadow:0 22px 70px rgba(0,0,0,.45);
    }

    h1 {
      text-align:center;
      font-size:2.8rem;
      font-weight:800;
      background:linear-gradient(90deg,#e0f2fe,#d4af37,#bae6fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:12px;
    }

    .subtitle {
      text-align:center;
      color:#94a3b8;
      margin-bottom:34px;
    }

    input {
      width:100%;
      padding:17px;
      margin-bottom:18px;
      background:#1e2937;
      border:1px solid #334155;
      border-radius:14px;
      color:white;
      font-size:1rem;
      outline:none;
    }

    input:focus {
      border-color:rgba(212,175,55,.75);
    }

    .btn {
      width:100%;
      padding:18px;
      background:linear-gradient(#d4af37,#f0d080);
      color:#0a1428;
      border:none;
      border-radius:999px;
      font-size:1.15rem;
      font-weight:800;
      cursor:pointer;
      margin-top:6px;
    }

    .link-text {
      text-align:center;
      margin-top:24px;
      color:#cbd5e1;
    }

    .link-text a {
      color:var(--gold);
      text-decoration:none;
      font-weight:700;
    }

    @media(max-width:650px) {
      body { padding:10px; }
      .page { padding:80px 16px 40px; }
      .form-box { padding:30px 22px; }
      h1 { font-size:2.25rem; }
      .nav { left:0; right:0; justify-content:center; }
    }
  </style>
</head>

<body>
  <div class="browser">
    <div class="title-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>

    <div class="page">
      <div class="nav">
        <a href="index.html">Home</a>
        <a href="pricing.html">Plans</a>
        <a href="signup.html">Sign Up</a>
      </div>

      <div class="form-box">
        <h1>Sign In</h1>
        <p class="subtitle">Welcome back to Lumina.</p>

        <input id="loginEmail" type="email" placeholder="Email Address">
        <input id="loginPassword" type="password" placeholder="Password">

        <button class="btn" onclick="loginUser()">Sign In</button>

        <p class="link-text">
          Don't have an account? <a href="signup.html">Create Account</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:5000/api/auth";

    async function loginUser() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {

          if (data.requiresVerification) {

            window.location.href =
              "/verify-email?email=" +
              encodeURIComponent(data.email);

            return;
          }

          alert(data.message || "Login failed.");
          return;
        }

        localStorage.setItem("luminaToken", data.token);
        localStorage.setItem("luminaUserId", data.user.id);
        localStorage.setItem("luminaName", data.user.fullName);
        localStorage.setItem("luminaEmail", data.user.email);
        localStorage.setItem("luminaBalance", data.user.balance);
        localStorage.setItem("luminaReferralCode", data.user.referralCode);
        localStorage.setItem("luminaReferralCount", data.user.referralCount || 0);

        localStorage.setItem("luminaPlan", data.user.plan || 1);
        localStorage.setItem("luminaPlanName", data.user.planName || "Starter");
        localStorage.setItem("luminaPlanActive", data.user.planActive ? "true" : "false");

        const pendingPlan = localStorage.getItem("pendingPlan");

        if (pendingPlan) {
          localStorage.setItem("luminaPlan", pendingPlan);
          localStorage.removeItem("pendingPlan");
          window.location.href = "payment.html";
          return;
        }

        window.location.href = "dashboard.html";

      } catch (error) {
        console.error(error);
        alert("Backend not reachable. Start npm run dev first.");
      }
    }
  </script>
</body>
</html>
