<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Transactions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold:#d4af37;
      --text:#e0e7ff;
      --muted:#94a3b8;
      --panel:rgba(15,23,42,.88);
      --green:#22c55e;
      --red:#ef4444;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:Inter,sans-serif;
      background:#0a1428;
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .browser {
      max-width:1100px;
      margin:auto;
      background:#1e2937;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.75);
      border:1px solid rgba(255,255,255,.08);
    }

    .title-bar {
      height:46px;
      background:#1e2937;
      display:flex;
      align-items:center;
      padding:0 18px;
      gap:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .dot { width:13px; height:13px; border-radius:50%; }
    .red-dot { background:#ff5f57; }
    .yellow-dot { background:#ffbd2e; }
    .green-dot { background:#27c93f; }

    .page {
      position:relative;
      min-height:88vh;
      padding:36px;
      background:#0a1428;
      overflow:hidden;
    }

    .page::before {
      content:"";
      position:absolute;
      inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(24px) brightness(.42);
      transform:scale(1.15);
      z-index:1;
    }

    .page > * { position:relative; z-index:2; }

    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:28px;
    }

    h1 {
      font-size:3rem;
      font-weight:800;
      background:linear-gradient(90deg,#e0f2fe,var(--gold),#bae6fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle {
      color:var(--muted);
      margin-top:8px;
    }

    .nav {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .nav a {
      text-decoration:none;
      color:#fde68a;
      background:rgba(15,23,42,.72);
      border:1px solid rgba(212,175,55,.28);
      padding:11px 16px;
      border-radius:999px;
      font-weight:700;
    }

    .summary {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      margin-bottom:24px;
    }

    .summary-card {
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.24);
      border-radius:22px;
      padding:22px;
    }

    .summary-card span {
      color:var(--muted);
      font-size:.92rem;
    }

    .summary-card strong {
      display:block;
      margin-top:8px;
      font-size:1.7rem;
      color:white;
    }

    .list {
      display:grid;
      gap:14px;
    }

    .tx {
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.24);
      border-radius:22px;
      padding:20px;
      display:grid;
      grid-template-columns:1.2fr .7fr .7fr;
      gap:16px;
      align-items:center;
    }

    .tx h3 {
      color:white;
      margin-bottom:6px;
    }

    .tx p {
      color:var(--muted);
      font-size:.92rem;
      line-height:1.5;
      word-break:break-word;
    }

    .amount {
      font-size:1.25rem;
      font-weight:800;
      color:#fde68a;
      text-align:right;
    }

    .status {
      text-align:right;
      font-weight:800;
      text-transform:capitalize;
    }

    .completed, .approved { color:#86efac; }
    .pending { color:#fde68a; }
    .rejected { color:#fca5a5; }

    .empty {
      background:var(--panel);
      border:1px solid rgba(212,175,55,.24);
      border-radius:22px;
      padding:34px;
      text-align:center;
      color:#cbd5e1;
    }

    @media(max-width:800px) {
      body { padding:10px; }
      .page { padding:22px; }
      .top { flex-direction:column; align-items:flex-start; }
      h1 { font-size:2.3rem; }
      .summary { grid-template-columns:1fr; }
      .tx { grid-template-columns:1fr; }
      .amount, .status { text-align:left; }
    }
  </style>
</head>

<body>
  <div class="browser">
    <div class="title-bar">
      <div class="dot red-dot"></div>
      <div class="dot yellow-dot"></div>
      <div class="dot green-dot"></div>
    </div>

    <div class="page">
      <div class="top">
        <div>
          <h1>Transaction History</h1>
          <p class="subtitle">Your full Lumina account activity.</p>
        </div>

        <div class="nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="withdraw.html">Withdraw</a>
          <a href="investment.html">Invest</a>
        </div>
      </div>

      <div class="summary">
        <div class="summary-card">
          <span>Total Transactions</span>
          <strong id="totalCount">0</strong>
        </div>

        <div class="summary-card">
          <span>Total Rewards</span>
          <strong id="totalRewards">$0.00</strong>
        </div>

        <div class="summary-card">
          <span>Total Withdrawals</span>
          <strong id="totalWithdrawals">$0.00</strong>
        </div>
      </div>

      <div class="list" id="transactions"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("luminaToken");

    if (!token || token === "undefined" || token === "null") {
      localStorage.clear();
      window.location.href = "login.html";
    }

    const API = "https://lmnabcknd.onrender.com/api/transactions";

    function authHeaders() {
      return {
        "Authorization": "Bearer " + token
      };
    }

    function labelType(type) {
      const labels = {
        task_reward: "Task Reward",
        payment_approved: "Payment Approved",
        withdrawal_request: "Withdrawal Request",
        withdrawal_approved: "Withdrawal Approved",
        withdrawal_rejected_refund: "Withdrawal Refund",
        trade_simulation: "Trade Simulation"
      };

      return labels[type] || type;
    }

    async function loadTransactions() {
      const box = document.getElementById("transactions");

      box.innerHTML = `<div class="empty">Loading transactions...</div>`;

      try {
        const res = await fetch(API + "/my", {
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok) {
          box.innerHTML = `<div class="empty">${data.message || "Unable to load transactions."}</div>`;
          return;
        }

        const txs = data.transactions || [];

        document.getElementById("totalCount").innerText = txs.length;

        const totalRewards = txs
          .filter(t => t.type === "task_reward" || t.type === "withdrawal_rejected_refund")
          .reduce((sum, t) => sum + Number(t.amount || 0), 0);

        const totalWithdrawals = txs
          .filter(t => t.type === "withdrawal_request" || t.type === "withdrawal_approved")
          .reduce((sum, t) => sum + Number(t.amount || 0), 0);

        document.getElementById("totalRewards").innerText = "$" + totalRewards.toFixed(2);
        document.getElementById("totalWithdrawals").innerText = "$" + totalWithdrawals.toFixed(2);

        box.innerHTML = "";

        if (!txs.length) {
          box.innerHTML = `<div class="empty">No transactions yet.</div>`;
          return;
        }

        txs.forEach(t => {
          const div = document.createElement("div");
          div.className = "tx";

          div.innerHTML = `
            <div>
              <h3>${t.title || labelType(t.type)}</h3>
              <p>${labelType(t.type)}</p>
              <p>Reference: ${t.referenceId || "—"}</p>
              <p>${new Date(t.createdAt).toLocaleString()}</p>
            </div>

            <div class="amount">
              ${Number(t.amount || 0).toFixed(2)}
            </div>

            <div class="status ${t.status}">
              ${t.status}
            </div>
          `;

          box.appendChild(div);
        });

      } catch (error) {
        box.innerHTML = `<div class="empty">Backend not reachable.</div>`;
      }
    }

    loadTransactions();
  </script>
</body>
</html>
