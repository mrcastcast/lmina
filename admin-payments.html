<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold:#d4af37;
      --text:#e0e7ff;
      --muted:#94a3b8;
      --panel:rgba(15,23,42,.88);
      --green:#22c55e;
      --red:#ef4444;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:Inter,sans-serif;
      background:#0a1428;
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .browser {
      max-width:1300px;
      margin:auto;
      background:#1e2937;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.75);
      border:1px solid rgba(255,255,255,.08);
    }

    .title-bar {
      height:46px;
      background:#1e2937;
      display:flex;
      align-items:center;
      padding:0 18px;
      gap:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .dot { width:13px; height:13px; border-radius:50%; }
    .red-dot { background:#ff5f57; }
    .yellow-dot { background:#ffbd2e; }
    .green-dot { background:#27c93f; }

    .page {
      position:relative;
      min-height:88vh;
      padding:34px;
      overflow:hidden;
      background:#0a1428;
    }

    .page::before {
      content:"";
      position:absolute;
      inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(26px) brightness(.38);
      transform:scale(1.18);
      z-index:1;
    }

    .page > * { position:relative; z-index:2; }

    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:28px;
    }

    h1 {
      font-size:3rem;
      font-weight:800;
      background:linear-gradient(90deg,#e0f2fe,var(--gold),#bae6fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle {
      color:var(--muted);
      margin-top:8px;
    }

    .actions {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn, .glass-btn {
      border:none;
      border-radius:999px;
      padding:13px 18px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
    }

    .btn {
      background:linear-gradient(#d4af37,#f0d080);
      color:#071225;
    }

    .glass-btn {
      border:1px solid rgba(212,175,55,.35);
      background:rgba(15,23,42,.72);
      color:#fde68a;
      backdrop-filter:blur(14px);
    }

    .summary {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:24px;
    }

    .summary-card {
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.24);
      border-radius:22px;
      padding:22px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }

    .summary-card span {
      color:var(--muted);
      font-size:.92rem;
    }

    .summary-card strong {
      display:block;
      margin-top:8px;
      font-size:1.8rem;
      color:white;
    }

    .section {
      margin-top:26px;
    }

    .section h2 {
      margin-bottom:16px;
      color:#fde68a;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
    }

    .item {
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.28);
      border-radius:26px;
      padding:24px;
      box-shadow:0 20px 60px rgba(0,0,0,.42);
    }

    .status-box {
      text-align:center;
      padding:18px;
      border-radius:20px;
      background:rgba(212,175,55,.12);
      border:1px solid rgba(212,175,55,.35);
      margin-bottom:18px;
    }

    .status-box h3 {
      color:#fde68a;
      font-size:1.5rem;
      margin-bottom:6px;
    }

    .row {
      display:flex;
      justify-content:space-between;
      gap:14px;
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .row span { color:var(--muted); }
    .row strong {
      color:white;
      text-align:right;
      word-break:break-word;
    }

    .item-actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:18px;
    }

    .approve {
      border:none;
      border-radius:16px;
      padding:14px;
      background:linear-gradient(#22c55e,#86efac);
      color:#071225;
      font-weight:900;
      cursor:pointer;
    }

    .reject {
      border:none;
      border-radius:16px;
      padding:14px;
      background:linear-gradient(#ef4444,#fca5a5);
      color:#071225;
      font-weight:900;
      cursor:pointer;
    }

    .empty {
      grid-column:1/-1;
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.24);
      border-radius:26px;
      padding:34px;
      text-align:center;
      color:#cbd5e1;
    }

    @media(max-width:1000px) {
      .summary { grid-template-columns:repeat(2,1fr); }
      .grid { grid-template-columns:1fr; }
    }

    @media(max-width:650px) {
      body { padding:10px; }
      .page { padding:20px; }
      .top { flex-direction:column; align-items:flex-start; }
      h1 { font-size:2.3rem; }
      .summary { grid-template-columns:1fr; }
      .row { flex-direction:column; }
      .row strong { text-align:left; }
      .item-actions { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="browser">
    <div class="title-bar">
      <div class="dot red-dot"></div>
      <div class="dot yellow-dot"></div>
      <div class="dot green-dot"></div>
    </div>

    <div class="page">
      <div class="top">
        <div>
          <h1>Admin Dashboard</h1>
          <p class="subtitle">Review payments and withdrawals from one panel.</p>
        </div>

        <div class="actions">
          <a class="glass-btn" href="dashboard.html">User Dashboard</a>
          <button class="glass-btn" onclick="adminLogout()">Logout Admin</button>
          <button class="btn" onclick="loadAdminData()">Refresh</button>
        </div>
      </div>

      <div class="summary">
        <div class="summary-card">
          <span>Pending Payments</span>
          <strong id="pendingPaymentsCount">0</strong>
        </div>

        <div class="summary-card">
          <span>Payment Value</span>
          <strong id="pendingPaymentsValue">0 USDT</strong>
        </div>

        <div class="summary-card">
          <span>Pending Withdrawals</span>
          <strong id="pendingWithdrawalsCount">0</strong>
        </div>

        <div class="summary-card">
          <span>Withdrawal Value</span>
          <strong id="pendingWithdrawalsValue">0 USDT</strong>
        </div>
      </div>

      <div class="section">
        <h2>Pending Payments</h2>
        <div class="grid" id="payments"></div>
      </div>

      <div class="section">
        <h2>Pending Withdrawals</h2>
        <div class="grid" id="withdrawals"></div>
      </div>
    </div>
  </div>

  <script>
    const adminToken = localStorage.getItem("luminaAdminToken");

    if (!adminToken || adminToken === "undefined" || adminToken === "null") {
      window.location.href = "admin-login.html";
    }

    const PAYMENTS_API = "https://lmnabcknd.onrender.com/api/payments";
    const WITHDRAWALS_API = "https://lmnabcknd.onrender.com/api/withdrawals";

    function adminHeaders() {
      return {
        "Authorization": "Bearer " + localStorage.getItem("luminaAdminToken")
      };
    }

    function adminLogout() {
      localStorage.removeItem("luminaAdminToken");
      window.location.href = "admin-login.html";
    }

    async function loadAdminData() {
      await loadPayments();
      await loadWithdrawals();
    }

    async function loadPayments() {
      const box = document.getElementById("payments");

      box.innerHTML = `
        <div class="empty">Loading payments...</div>
      `;

      try {
        const res = await fetch(PAYMENTS_API + "/pending", {
          headers: adminHeaders()
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem("luminaAdminToken");
          window.location.href = "admin-login.html";
          return;
        }

        const payments = await res.json();

        document.getElementById("pendingPaymentsCount").innerText = payments.length;

        const total = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
        document.getElementById("pendingPaymentsValue").innerText = total + " USDT";

        box.innerHTML = "";

        if (!payments.length) {
          box.innerHTML = `<div class="empty">No pending payments.</div>`;
          return;
        }

        payments.forEach(p => {
          const div = document.createElement("div");
          div.className = "item";

          div.innerHTML = `
            <div class="status-box">
              <h3>Payment Sent</h3>
              <p>Waiting for plan activation.</p>
            </div>

            <div class="row"><span>Payment ID</span><strong>${p.paymentId}</strong></div>
            <div class="row"><span>User</span><strong>${p.fullName}</strong></div>
            <div class="row"><span>Email</span><strong>${p.email}</strong></div>
            <div class="row"><span>Plan</span><strong>${p.planName}</strong></div>
            <div class="row"><span>Amount</span><strong>${p.amount} USDT</strong></div>
            <div class="row"><span>TXID</span><strong>${p.txid}</strong></div>
            <div class="row"><span>Date</span><strong>${new Date(p.createdAt).toLocaleString()}</strong></div>

            <div class="item-actions">
              <button class="approve" onclick="approvePayment('${p._id}')">Approve Plan</button>
              <button class="reject" onclick="rejectPayment('${p._id}')">Reject</button>
            </div>
          `;

          box.appendChild(div);
        });

      } catch {
        box.innerHTML = `<div class="empty">Backend not reachable.</div>`;
      }
    }

    async function approvePayment(id) {
      const res = await fetch(PAYMENTS_API + "/" + id + "/approve", {
        method: "POST",
        headers: adminHeaders()
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Approve failed");
        return;
      }

      alert("Plan activated for: " + data.user.email);
      loadAdminData();
    }

    async function rejectPayment(id) {
      await fetch(PAYMENTS_API + "/" + id + "/reject", {
        method: "POST",
        headers: adminHeaders()
      });

      loadAdminData();
    }

    async function loadWithdrawals() {
      const box = document.getElementById("withdrawals");

      box.innerHTML = `
        <div class="empty">Loading withdrawals...</div>
      `;

      try {
        const res = await fetch(WITHDRAWALS_API + "/pending", {
          headers: adminHeaders()
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem("luminaAdminToken");
          window.location.href = "admin-login.html";
          return;
        }

        const withdrawals = await res.json();

        document.getElementById("pendingWithdrawalsCount").innerText = withdrawals.length;

        const total = withdrawals.reduce((sum, w) => sum + Number(w.amount || 0), 0);
        document.getElementById("pendingWithdrawalsValue").innerText = total + " USDT";

        box.innerHTML = "";

        if (!withdrawals.length) {
          box.innerHTML = `<div class="empty">No pending withdrawals.</div>`;
          return;
        }

        withdrawals.forEach(w => {
          const div = document.createElement("div");
          div.className = "item";

          div.innerHTML = `
            <div class="status-box">
              <h3>Withdrawal Request</h3>
              <p>Waiting for manual admin review.</p>
            </div>

            <div class="row"><span>Withdrawal ID</span><strong>${w.withdrawalId}</strong></div>
            <div class="row"><span>User</span><strong>${w.fullName}</strong></div>
            <div class="row"><span>Email</span><strong>${w.email}</strong></div>
            <div class="row"><span>Amount</span><strong>${w.amount} USDT</strong></div>
            <div class="row"><span>Network</span><strong>${w.network}</strong></div>
            <div class="row"><span>Wallet</span><strong>${w.walletAddress}</strong></div>
            <div class="row"><span>Date</span><strong>${new Date(w.createdAt).toLocaleString()}</strong></div>

            <div class="item-actions">
              <button class="approve" onclick="approveWithdrawal('${w._id}')">Approve</button>
              <button class="reject" onclick="rejectWithdrawal('${w._id}')">Reject & Return Balance</button>
            </div>
          `;

          box.appendChild(div);
        });

      } catch {
        box.innerHTML = `<div class="empty">Backend not reachable.</div>`;
      }
    }

    async function approveWithdrawal(id) {
      await fetch(WITHDRAWALS_API + "/" + id + "/approve", {
        method: "POST",
        headers: adminHeaders()
      });

      loadAdminData();
    }

    async function rejectWithdrawal(id) {
      await fetch(WITHDRAWALS_API + "/" + id + "/reject", {
        method: "POST",
        headers: adminHeaders()
      });

      loadAdminData();
    }

    loadAdminData();
  </script>
</body>
</html>
