<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Withdraw</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root { --gold:#d4af37; --text:#e0e7ff; --muted:#94a3b8; --panel:rgba(15,23,42,.88); }
    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:Inter,sans-serif;
      background:#0a1428;
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .browser {
      max-width:1000px;
      margin:auto;
      background:#1e2937;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.75);
      border:1px solid rgba(255,255,255,.08);
    }

    .title-bar {
      height:46px;
      background:#1e2937;
      display:flex;
      align-items:center;
      padding:0 18px;
      gap:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .dot { width:13px; height:13px; border-radius:50%; }
    .red { background:#ff5f57; }
    .yellow { background:#ffbd2e; }
    .green { background:#27c93f; }

    .page {
      position:relative;
      min-height:85vh;
      padding:50px 28px;
      overflow:hidden;
      background:#0a1428;
    }

    .page::before {
      content:"";
      position:absolute;
      inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(24px) brightness(.42);
      transform:scale(1.15);
      z-index:1;
    }

    .page > * { position:relative; z-index:2; }

    h1 {
      text-align:center;
      font-size:3rem;
      font-weight:800;
      background:linear-gradient(90deg,#e0f2fe,var(--gold),#bae6fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:10px;
    }

    .subtitle {
      text-align:center;
      color:var(--muted);
      margin-bottom:34px;
    }

    .withdraw-info {
    display: block;
    margin: 18px 0;
    padding: 16px;
    border-radius: 16px;
    background: rgba(212,175,55,.12);
    border: 1px dashed rgba(212,175,55,.55);
    color: #fde68a;
    text-align: center;
    font-weight: 800;
    line-height: 1.6;
    }

    .card {
      max-width:680px;
      margin:auto;
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.3);
      border-radius:30px;
      padding:34px;
      box-shadow:0 22px 70px rgba(0,0,0,.45);
    }

    .row {
      display:flex;
      justify-content:space-between;
      gap:16px;
      padding:15px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .row span { color:var(--muted); }
    .row strong { color:#fff; }

    input {
      width:100%;
      margin-top:16px;
      padding:16px;
      border-radius:16px;
      border:1px solid #334155;
      background:#1e2937;
      color:white;
      outline:none;
      font-size:1rem;
    }

    button {
      width:100%;
      margin-top:16px;
      border:none;
      border-radius:999px;
      padding:17px;
      background:linear-gradient(#d4af37,#f0d080);
      color:#0a1428;
      font-size:1.05rem;
      font-weight:800;
      cursor:pointer;
    }

    .status {
      display:none;
      margin-top:18px;
      padding:18px;
      border-radius:18px;
      background:rgba(212,175,55,.12);
      border:1px solid rgba(212,175,55,.35);
      color:#fde68a;
      text-align:center;
      font-weight:700;
      line-height:1.6;
    }

    .back {
      display:block;
      text-align:center;
      margin-top:18px;
      color:#fde68a;
      text-decoration:none;
      font-weight:700;
    }

    .history {
      margin-top:28px;
    }

    .item {
      margin-top:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(30,41,59,.75);
      border:1px solid rgba(255,255,255,.08);
      color:#cbd5e1;
      line-height:1.6;
    }

    @media(max-width:650px) {
      body { padding:10px; }
      h1 { font-size:2.3rem; }
      .card { padding:24px; }
      .row { flex-direction:column; }
    }
  </style>
</head>

<body>
  <div class="browser">
    <div class="title-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>

    <div class="page">
      <h1>Withdraw Funds</h1>
      <p class="subtitle">Manual withdrawal request. Admin approval required.</p>

      <div class="card">
        <div class="row">
          <span>Available Balance</span>
          <strong id="balance">$0.00</strong>
        </div>

        <p class="withdraw-info">
          Minimum withdrawal: $100<br>
          Withdrawal cooldown: 7 days
        </p>

        <div class="row">
          <span>Network</span>
          <strong>USDT TRC20</strong>
        </div>

        <input id="amount" type="number" placeholder="Withdrawal amount" />
        <input id="walletAddress" placeholder="Your USDT TRC20 wallet address" />

        <button onclick="requestWithdrawal()">Request Withdrawal</button>

        <div class="status" id="status"></div>

        <a class="back" href="dashboard.html">← Back to Dashboard</a>

        <div class="history">
          <h3 style="margin-top:25px;">My Withdrawal Requests</h3>
          <div id="withdrawals"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("luminaToken");

    if (!token || token === "undefined" || token === "null") {
      localStorage.clear();
      window.location.href = "login.html";
    }

    const API = "https://lmnabcknd-production.up.railway.app/api/withdrawals";
    const USER_API = "https://lmnabcknd-production.up.railway.app/api/user";

    function authHeaders(extra = {}) {
      return {
        ...extra,
        "Authorization": "Bearer " + token
      };
    }

    async function loadUserBalance() {
      try {
        const res = await fetch(USER_API + "/me", {
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok) {
          localStorage.clear();
          window.location.href = "login.html";
          return;
        }

        document.getElementById("balance").innerText =
          "$" + Number(data.user.balance).toFixed(2);

        localStorage.setItem("luminaBalance", data.user.balance);

      } catch {
        alert("Backend not reachable.");
      }
    }

    async function requestWithdrawal() {
      const amount = Number(document.getElementById("amount").value);
      const walletAddress = document.getElementById("walletAddress").value.trim();

      if (!amount || amount <= 0) {
        alert("Enter valid amount.");
        return;
      }

      if (!walletAddress) {
        alert("Enter wallet address.");
        return;
      }

      try {
        const res = await fetch(API + "/request", {
          method: "POST",
          headers: authHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify({
            amount,
            walletAddress
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || "Withdrawal failed.");
          return;
        }

        const status = document.getElementById("status");
        status.style.display = "block";
        status.innerHTML = `
          ✅ Withdrawal Request Sent<br><br>
          <strong>Withdrawal ID:</strong> ${data.withdrawal.withdrawalId}<br>
          <strong>Status:</strong> Pending Admin Review
        `;

        document.getElementById("amount").value = "";
        document.getElementById("walletAddress").value = "";

        await loadUserBalance();
        await loadMyWithdrawals();

      } catch {
        alert("Backend not reachable.");
      }
    }

    async function loadMyWithdrawals() {
      const box = document.getElementById("withdrawals");

      try {
        const res = await fetch(API + "/my", {
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok) return;

        box.innerHTML = "";

        if (!data.withdrawals.length) {
          box.innerHTML = `<div class="item">No withdrawal requests yet.</div>`;
          return;
        }

        data.withdrawals.forEach(w => {
          box.innerHTML += `
            <div class="item">
              <strong>${w.withdrawalId}</strong><br>
              Amount: ${w.amount} USDT<br>
              Status: ${w.status}<br>
              Wallet: ${w.walletAddress}<br>
              Date: ${new Date(w.createdAt).toLocaleString()}
            </div>
          `;
        });

      } catch {
        box.innerHTML = `<div class="item">Unable to load withdrawals.</div>`;
      }
    }

    loadUserBalance();
    loadMyWithdrawals();
  </script>
</body>
</html>
