<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#d4af37; --text:#e0e7ff; --muted:#94a3b8; --panel:rgba(15,23,42,.88); --green:#22c55e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,sans-serif; background:#0a1428; color:var(--text); min-height:100vh; padding:24px; }
    .browser { max-width:1000px; margin:auto; background:#1e2937; border-radius:22px; overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.75); border:1px solid rgba(255,255,255,.08); }
    .title-bar { height:46px; background:#1e2937; display:flex; align-items:center; padding:0 18px; gap:8px; border-bottom:1px solid rgba(255,255,255,.08); }
    .dot { width:13px; height:13px; border-radius:50%; } .red{background:#ff5f57;} .yellow{background:#ffbd2e;} .green{background:#27c93f;}

    .page { position:relative; min-height:85vh; padding:50px 28px; overflow:hidden; background:#0a1428; }
    .page::before {
      content:""; position:absolute; inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(24px) brightness(.42); transform:scale(1.15); z-index:1;
    }
    .page > * { position:relative; z-index:2; }

    h1 { text-align:center; font-size:3rem; font-weight:800; background:linear-gradient(90deg,#e0f2fe,var(--gold),#bae6fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:10px; }
    .subtitle { text-align:center; color:var(--muted); margin-bottom:34px; }

    .card { max-width:650px; margin:auto; background:var(--panel); backdrop-filter:blur(18px); border:1px solid rgba(212,175,55,.3); border-radius:30px; padding:34px; box-shadow:0 22px 70px rgba(0,0,0,.45); }
    .row { display:flex; justify-content:space-between; gap:16px; padding:15px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .row span { color:var(--muted); } .row strong { color:#fff; }

  .back-btn {
    display:block;
    width:100%;
    margin-top:12px;
    text-align:center;
    padding:16px;
    border-radius:999px;
    background:rgba(15,23,42,.75);
    border:1px solid rgba(212,175,55,.25);
    color:#fde68a;
    text-decoration:none;
    font-weight:800;
  }

    .wallet { margin-top:24px; padding:18px; border-radius:18px; background:rgba(212,175,55,.1); border:1px dashed rgba(212,175,55,.55); word-break:break-all; font-family:monospace; color:#fde68a; line-height:1.5; }
    .qr { width:170px; height:170px; margin:24px auto; border-radius:22px; display:grid; place-items:center; background:#fff; color:#0a1428; font-weight:800; text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.35); }
    input { width:100%; margin-top:16px; padding:16px; border-radius:16px; border:1px solid #334155; background:#1e2937; color:white; outline:none; font-size:1rem; }
    button { width:100%; margin-top:16px; border:none; border-radius:999px; padding:17px; background:linear-gradient(#d4af37,#f0d080); color:#0a1428; font-size:1.05rem; font-weight:800; cursor:pointer; }
    button:hover { transform:scale(1.02); }

    .status { display:none; margin-top:18px; padding:18px; border-radius:18px; background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.35); color:#fde68a; text-align:center; font-weight:700; line-height:1.6; }
    .warning { margin-top:22px; color:#cbd5e1; font-size:.9rem; text-align:center; line-height:1.6; }

    @media(max-width:650px){ body{padding:10px;} h1{font-size:2.3rem;} .card{padding:24px;} .row{flex-direction:column;} }
  </style>
</head>
<body>
  <div class="browser">
    <div class="title-bar">
      <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
    </div>

    <div class="page">
      <h1>Complete Your Plan</h1>
      <p class="subtitle">USDT TRC20 manual approval screen.</p>

      <div class="card">
        <div class="row"><span>Selected Plan</span><strong id="planName">Starter</strong></div>
        <div class="row"><span>Amount</span><strong id="planPrice">250 USDT</strong></div>
        <div class="row"><span>Network</span><strong>USDT TRC20</strong></div>
        <div class="row"><span>Payment Window</span><strong id="timer">14:59</strong></div>

        <div class="wallet" id="walletAddress">T_DEMO_WALLET_ADDRESS_DO_NOT_SEND_REAL_USDT_123456789</div>
        <button onclick="copyWallet()">Copy Wallet Address</button>

        <div class="qr">DEMO<br>QR</div>

        <button onclick="confirmPayment()">I Have Sent the Payment</button>
        <a href="dashboard.html" class="back-btn"> ← Back to Dashboard</a>
        <div class="status" id="status"></div>

        <p class="warning">After submission, your payment remains pending until admin approval.</p>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("luminaToken");

    if (!token || token === "undefined" || token === "null") {
      localStorage.clear();
      window.location.href = "login.html";
    }

    const API = "https://lmnabcknd-production.up.railway.app/api/payments";

    const planNumber = Number(localStorage.getItem("luminaPlan")) || 1;

    const plans = {
      1: { name: "Starter", price: 250 },
      2: { name: "Pro", price: 600 },
      3: { name: "Elite", price: 1150 },
      4: { name: "Legend", price: 2100 }
    };

    document.getElementById("planName").innerText = plans[planNumber].name;
    document.getElementById("planPrice").innerText = plans[planNumber].price + " USDT";

    function copyWallet() {
      navigator.clipboard.writeText(document.getElementById("walletAddress").innerText);
      alert("Wallet address copied.");
    }

    async function confirmPayment() {

      const userEmail = localStorage.getItem("luminaEmail");
      const userName = localStorage.getItem("luminaName");

      if (!userEmail) {
        alert("User email missing. Please login again.");
        localStorage.clear();
        window.location.href = "login.html";
        return;
      }

      const payload = {
        fullName: userName || "Unknown User",
        email: userEmail,
        planNumber,
        planName: plans[planNumber].name,
        amount: plans[planNumber].price,
      };

      try {
        const res = await fetch(API + "/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || "Payment submit failed.");
          return;
        }

        localStorage.setItem("luminaPaymentStatus", "pending");
        localStorage.setItem("luminaPaymentId", data.payment.paymentId);
        localStorage.setItem("luminaSelectedPlanName", plans[planNumber].name);

        const status = document.getElementById("status");
        status.style.display = "block";
        status.innerHTML = `
          ✅ Payment Request Submitted<br><br>
          <strong>Payment ID:</strong> ${data.payment.paymentId}<br>
          <strong>Status:</strong> Pending Admin Approval<br><br>

          Please contact admin for payment verification and approval.<br><br>

          <a 
            href="https://t.me/YOUR_ADMIN_USERNAME" 
            target="_blank"
            style="
              display:inline-block;
              margin-top:10px;
              padding:12px 18px;
              border-radius:999px;
              background:linear-gradient(#d4af37,#f0d080);
              color:#0a1428;
              text-decoration:none;
              font-weight:800;
            "
          >
            Contact Admin
          </a>

          <br><br>

          <a 
            href="dashboard.html"
            style="color:#fde68a;font-weight:800;text-decoration:none;"
          >
            ← Back to Dashboard
          </a>
        `;

      } catch (err) {
        alert("Backend not reachable.");
      }
    }

    let seconds = 15 * 60;

    setInterval(() => {
      seconds--;

      if (seconds <= 0) {
        document.getElementById("timer").innerText = "Expired";
        return;
      }

      const m = Math.floor(seconds / 60);
      const s = seconds % 60;

      document.getElementById("timer").innerText =
        String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }, 1000);
  </script>
</body>
</html>
