<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina AI Investment Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#0a1428;
      --panel:rgba(15,23,42,.86);
      --gold:#d4af37;
      --text:#e0e7ff;
      --muted:#94a3b8;
      --green:#22c55e;
      --red:#ef4444;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:Inter, sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .app {
      max-width:1280px;
      margin:auto;
      border-radius:22px;
      overflow:hidden;
      background:#1e2937;
      box-shadow:0 30px 90px rgba(0,0,0,.7);
      border:1px solid rgba(255,255,255,.08);
    }

    .title-bar {
      height:46px;
      background:#1e2937;
      display:flex;
      align-items:center;
      padding:0 18px;
      gap:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .dot { width:13px; height:13px; border-radius:50%; }
    .red-dot { background:#ff5f57; }
    .yellow-dot { background:#ffbd2e; }
    .green-dot { background:#27c93f; }

    .page {
      position:relative;
      min-height:88vh;
      padding:30px;
      overflow:hidden;
      background:#0a1428;
    }

    .page::before {
      content:"";
      position:absolute;
      inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(24px) brightness(.42);
      transform:scale(1.15);
      z-index:1;
    }

    .page > * { position:relative; z-index:2; }

    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
      gap:18px;
    }

    .brand h1 {
      font-size:2.6rem;
      background:linear-gradient(90deg,#e0f2fe,var(--gold),#bae6fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:8px;
    }

    .brand p {
      color:var(--muted);
      line-height:1.5;
    }

    .nav {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .nav a {
      text-decoration:none;
      color:var(--text);
      background:rgba(15,23,42,.65);
      border:1px solid rgba(255,255,255,.08);
      padding:10px 16px;
      border-radius:999px;
      font-size:.95rem;
      cursor:pointer;
    }

    .nav a:hover {
      color:#0a1428;
      background:linear-gradient(#d4af37,#f0d080);
    }

    .status-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:24px;
    }

    .status-card {
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.22);
      border-radius:22px;
      padding:20px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }

    .status-card small {
      color:var(--muted);
    }

    .status-card strong {
      display:block;
      margin-top:8px;
      font-size:1.35rem;
      color:white;
    }

    .companies {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .card {
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.22);
      border-radius:24px;
      padding:22px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }

    .company {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:18px;
    }

    .name h3 {
      font-size:1.25rem;
      color:white;
      margin-bottom:5px;
    }

    .name p {
      color:var(--muted);
      font-size:.9rem;
    }

    .ticker {
      background:rgba(212,175,55,.14);
      border:1px solid rgba(212,175,55,.35);
      color:#fde68a;
      padding:8px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:.9rem;
    }

    .metric {
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .metric span {
      color:var(--muted);
    }

    .metric strong {
      color:white;
    }

    .positive { color:#86efac !important; }
    .negative { color:#fca5a5 !important; }

    .input-row {
      display:flex;
      gap:10px;
      margin-top:18px;
    }

    input {
      flex:1;
      padding:13px;
      border-radius:14px;
      border:1px solid #334155;
      background:#1e2937;
      color:white;
      outline:none;
    }

    button {
      border:none;
      border-radius:14px;
      padding:13px 16px;
      background:linear-gradient(#d4af37,#f0d080);
      color:#071225;
      font-weight:900;
      cursor:pointer;
    }

    button:disabled {
      opacity:.45;
      cursor:not-allowed;
    }

    .result {
      display:none;
      margin-top:16px;
      padding:16px;
      border-radius:16px;
      background:rgba(212,175,55,.11);
      border:1px solid rgba(212,175,55,.28);
      color:#cbd5e1;
      line-height:1.6;
    }

    .result.show {
      display:block;
    }

    @media(max-width:1050px) {
      .companies { grid-template-columns:repeat(2,1fr); }
      .status-grid { grid-template-columns:repeat(2,1fr); }
    }

    @media(max-width:700px) {
      body { padding:10px; }
      .page { padding:18px; }
      .top { flex-direction:column; align-items:flex-start; }
      .companies { grid-template-columns:1fr; }
      .status-grid { grid-template-columns:1fr; }
      .brand h1 { font-size:2rem; }
      .input-row { flex-direction:column; }
      .nav { width:100%; }
      .nav a { flex:1; text-align:center; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title-bar">
      <div class="dot red-dot"></div>
      <div class="dot yellow-dot"></div>
      <div class="dot green-dot"></div>
    </div>

    <div class="page">
      <div class="top">
        <div class="brand">
          <h1>AI Investment</h1>
          <p>Invest across global companies without risk.</p>
        </div>

        <div class="nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="pricing.html">Plans</a>
        </div>
      </div>

      <div class="status-grid">
        <div class="status-card">
          <small>Active Plan</small>
          <strong id="planStatus">Loading...</strong>
        </div>

        <div class="status-card">
          <small>Trades Allowed</small>
          <strong id="maxTrades">—</strong>
        </div>

        <div class="status-card">
          <small>Trades Left</small>
          <strong id="tradesLeft">—</strong>
        </div>

        <div class="status-card">
          <small>Cooldown Reset</small>
          <strong id="cooldownText">—</strong>
        </div>
      </div>

      <div class="companies" id="companies"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("luminaToken");

    if (!token || token === "undefined" || token === "null") {
      localStorage.clear();
      window.location.href = "login.html";
    }

    const TRADE_API = "https://lmnabcknd-production.up.railway.app/api/trades";

    const companyPool = [
      ["Apple Inc.", "AAPL", "Technology"],
      ["NVIDIA", "NVDA", "AI & Semiconductors"],
      ["Tesla", "TSLA", "Electric Vehicles"],
      ["Amazon", "AMZN", "E-commerce & Cloud"],
      ["Microsoft", "MSFT", "Cloud & AI"],
      ["Meta", "META", "Social & AI"],
      ["Alphabet", "GOOGL", "Search & AI"],
      ["Netflix", "NFLX", "Streaming"],
      ["AMD", "AMD", "Semiconductors"],
      ["Visa", "V", "Payments"],
      ["Coca-Cola", "KO", "Consumer Goods"],
      ["PayPal", "PYPL", "Fintech"]
    ];

    let companies = [];

    function authHeaders() {
      return {
        "Authorization": "Bearer " + token
      };
    }

    function randomBetween(min, max) {
      return +(Math.random() * (max - min) + min).toFixed(2);
    }

    function randomRisk() {
      const risks = ["Low", "Medium", "High"];
      return risks[Math.floor(Math.random() * risks.length)];
    }

    async function loadTradeStatus() {
      try {
        const res = await fetch(TRADE_API + "/status", {
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById("planStatus").innerText = "Unavailable";
          return null;
        }

        document.getElementById("planStatus").innerText =
          data.planActive ? data.planName : "Plan Not Active";

        document.getElementById("maxTrades").innerText = data.maxTrades;
        document.getElementById("tradesLeft").innerText =
          data.tradesLeft + "/" + data.maxTrades;

        document.getElementById("cooldownText").innerText = data.cooldownText;

        return data;

      } catch (error) {
        document.getElementById("planStatus").innerText = "Backend offline";
        return null;
      }
    }

    async function requestTradePermission() {
      try {
        const res = await fetch(TRADE_API + "/use", {
          method: "POST",
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message + "\nReset in: " + (data.cooldownText || "unknown"));
          await loadTradeStatus();
          renderCompanies();
          return false;
        }

        await loadTradeStatus();
        return data;

      } catch (error) {
        alert("Backend not reachable. Start server first.");
        return false;
      }
    }

    function shuffleCompanies() {
      const shuffled = [...companyPool].sort(() => Math.random() - 0.5);

      companies = shuffled.slice(0, 6).map(c => ({
        name: c[0],
        ticker: c[1],
        sector: c[2],
        trend: randomBetween(-4.5, 6.5),
        confidence: Math.floor(randomBetween(55, 94)),
        risk: randomRisk()
      }));

      renderCompanies();
    }

    function updateLiveData() {
      companies = companies.map(c => ({
        ...c,
        trend: randomBetween(-4.5, 6.5),
        confidence: Math.floor(randomBetween(55, 94)),
        risk: randomRisk()
      }));

      renderCompanies();
    }

    async function renderCompanies() {
      const status = await loadTradeStatus();
      const container = document.getElementById("companies");
      container.innerHTML = "";

      const isBlocked = !status || !status.planActive || status.tradesLeft <= 0;

      companies.forEach((c, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="company">
            <div class="name">
              <h3>${c.name}</h3>
              <p>${c.sector}</p>
            </div>
            <div class="ticker">${c.ticker}</div>
          </div>

          <div class="metric">
            <span>Market trend</span>
            <strong class="${c.trend >= 0 ? "positive" : "negative"}">
              ${c.trend >= 0 ? "+" : ""}${c.trend}%
            </strong>
          </div>

          <div class="metric">
            <span>AI confidence</span>
            <strong>${c.confidence}%</strong>
          </div>

          <div class="metric">
            <span>Risk level</span>
            <strong>${c.risk}</strong>
          </div>

          <div class="metric">
            <span>Trades left</span>
            <strong>${status ? status.tradesLeft + "/" + status.maxTrades : "—"}</strong>
          </div>

          <div class="metric">
            <span>Cooldown reset</span>
            <strong>${status ? status.cooldownText : "—"}</strong>
          </div>

          <div class="input-row">
            <input id="amount-${index}" type="number" placeholder="amount %" value="100">
            <button onclick="simulate(${index})" ${isBlocked ? "disabled" : ""}>
              ${!status?.planActive ? "Plan Inactive" : isBlocked ? "Cooldown" : "Invest"}
            </button>
          </div>

          <div class="result" id="result-${index}"></div>
        `;

        container.appendChild(card);
      });
    }

    async function simulate(index) {
      const permission = await requestTradePermission();

      if (!permission) {
        return;
      }

      const company = companies[index];
      const amount = Number(document.getElementById(`amount-${index}`).value);
      const resultBox = document.getElementById(`result-${index}`);

      if (!amount || amount <= 0) {
        resultBox.classList.add("show");
        resultBox.innerHTML = "Enter a valid demo amount.";
        return;
      }

      resultBox.classList.add("show");

      resultBox.innerHTML = `
        🤖 AI analyzing market trends...<br><br>
        Preparing investment into <strong>${company.name}</strong>...
      `;

      await new Promise(resolve => setTimeout(resolve, 2000));

      resultBox.innerHTML = `
        📊 Executing AI investment...<br><br>
        Monitoring volatility, liquidity and market sentiment...
      `;

      await new Promise(resolve => setTimeout(resolve, 2000));

      resultBox.innerHTML = `
        ⏳ Finalizing transaction...<br><br>
        AI securing optimized entry point...
      `;

      await new Promise(resolve => setTimeout(resolve, 1800));

      const randomFactor = randomBetween(-3, 5);
      const simulatedReturn = +(company.trend + randomFactor).toFixed(2);

      const profit = +(amount * simulatedReturn / 100).toFixed(2);

      const finalAmount = +(amount + profit).toFixed(2);

      resultBox.innerHTML = `
        ✅ Investment Successfully Executed<br><br>

        <strong>Company:</strong> ${company.name}<br>
        <strong>AI Return:</strong>
        <span class="${simulatedReturn >= 0 ? "positive" : "negative"}">
          ${simulatedReturn >= 0 ? "+" : ""}${simulatedReturn}%
        </span><br>

        <strong>Profit Generated:</strong>
        <span class="${profit >= 0 ? "positive" : "negative"}">
          ${profit >= 0 ? "+" : ""}$${Math.abs(profit)}
        </span><br>

        <strong>Final Portfolio Value:</strong> $${finalAmount}<br><br>

        AI investment completed successfully.
      `;
      
    }

    shuffleCompanies();
    setInterval(updateLiveData, 20000);
    setInterval(shuffleCompanies, 20000);
    setInterval(loadTradeStatus, 1000);
  </script>
</body>
</html>
