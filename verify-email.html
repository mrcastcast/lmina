<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Verify Email</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold:#d4af37;
      --text:#e0e7ff;
      --muted:#94a3b8;
      --panel:rgba(15,23,42,.88);
      --green:#22c55e;
      --red:#ef4444;
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      font-family:Inter,sans-serif;
      background:#0a1428;
      color:var(--text);
      min-height:100vh;
      padding:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .browser {
      width:100%;
      max-width:760px;
      background:#1e2937;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.75);
      border:1px solid rgba(255,255,255,.08);
    }

    .title-bar {
      height:46px;
      background:#1e2937;
      display:flex;
      align-items:center;
      padding:0 18px;
      gap:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .dot {
      width:13px;
      height:13px;
      border-radius:50%;
    }

    .red { background:#ff5f57; }
    .yellow { background:#ffbd2e; }
    .green { background:#27c93f; }

    .page {
      position:relative;
      min-height:650px;
      padding:50px 28px;
      overflow:hidden;
      background:#0a1428;
    }

    .page::before {
      content:"";
      position:absolute;
      inset:0;
      background:url("https://www.deloitte.com/content/dam/assets-zone2/lu/en/img/promos/industries/financial-services/2023/lu_wealth-management-private-banking-efma_1x1.jpg") center/cover no-repeat;
      filter:blur(24px) brightness(.42);
      transform:scale(1.15);
      z-index:1;
    }

    .page > * {
      position:relative;
      z-index:2;
    }

    .logo {
      width:64px;
      height:64px;
      margin:0 auto 20px;
      border-radius:22px;
      background:rgba(212,175,55,.15);
      border:1px solid rgba(212,175,55,.35);
      display:grid;
      place-items:center;
      color:var(--gold);
      font-size:30px;
    }

    h1 {
      text-align:center;
      font-size:2.7rem;
      font-weight:800;
      background:linear-gradient(90deg,#e0f2fe,var(--gold),#bae6fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:10px;
    }

    .subtitle {
      text-align:center;
      color:var(--muted);
      max-width:520px;
      margin:0 auto 30px;
      line-height:1.6;
    }

    .card {
      max-width:520px;
      margin:auto;
      background:var(--panel);
      backdrop-filter:blur(18px);
      border:1px solid rgba(212,175,55,.3);
      border-radius:30px;
      padding:34px;
      box-shadow:0 22px 70px rgba(0,0,0,.45);
    }

    label {
      display:block;
      color:#cbd5e1;
      font-size:.95rem;
      margin-bottom:9px;
      font-weight:700;
    }

    input {
      width:100%;
      padding:17px;
      border-radius:16px;
      border:1px solid #334155;
      background:#1e2937;
      color:white;
      outline:none;
      font-size:1.05rem;
      margin-bottom:16px;
    }

    input:focus {
      border-color:rgba(212,175,55,.85);
    }

    #code {
      text-align:center;
      font-size:1.8rem;
      letter-spacing:8px;
      font-weight:800;
    }

    button {
      width:100%;
      margin-top:6px;
      border:none;
      border-radius:999px;
      padding:17px;
      background:linear-gradient(#d4af37,#f0d080);
      color:#0a1428;
      font-size:1.05rem;
      font-weight:900;
      cursor:pointer;
    }

    button:hover {
      transform:scale(1.02);
    }

    .secondary {
      background:rgba(15,23,42,.72);
      border:1px solid rgba(212,175,55,.28);
      color:#fde68a;
      margin-top:12px;
    }

    .message {
      display:none;
      margin-top:18px;
      padding:16px;
      border-radius:18px;
      line-height:1.5;
      text-align:center;
      font-weight:700;
    }

    .success {
      display:block;
      background:rgba(34,197,94,.13);
      border:1px solid rgba(34,197,94,.35);
      color:#86efac;
    }

    .error {
      display:block;
      background:rgba(239,68,68,.13);
      border:1px solid rgba(239,68,68,.35);
      color:#fca5a5;
    }

    .info {
      margin-top:18px;
      color:var(--muted);
      text-align:center;
      font-size:.92rem;
      line-height:1.6;
    }

    .links {
      margin-top:20px;
      display:flex;
      justify-content:center;
      gap:16px;
      flex-wrap:wrap;
    }

    .links a {
      color:#fde68a;
      text-decoration:none;
      font-weight:700;
    }

    @media(max-width:650px) {
      body {
        padding:10px;
      }

      h1 {
        font-size:2.2rem;
      }

      .card {
        padding:24px;
      }

      #code {
        font-size:1.45rem;
        letter-spacing:5px;
      }
    }
  </style>
</head>

<body>
  <div class="browser">
    <div class="title-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>

    <div class="page">
      <div class="logo">✦</div>

      <h1>Verify Email</h1>

      <p class="subtitle">
        We sent a 6-digit verification code to your email. Enter it below to activate your Lumina account.
      </p>

      <div class="card">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" />

        <label for="code">Verification code</label>
        <input id="code" type="text" maxlength="6" placeholder="000000" />

        <button onclick="verifyEmail()">Verify Account</button>
        <button class="secondary" onclick="resendCode()">Resend Code</button>

        <div id="message" class="message"></div>

        <p class="info">
          The code expires in 10 minutes. If you do not see the email, check spam or promotions.
        </p>

        <div class="links">
          <a href="login.html">Back to Login</a>
          <a href="signup.html">Create Account</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://lmnabcknd.onrender.com/api/auth";

    const params = new URLSearchParams(window.location.search);
    const emailFromUrl = params.get("email");

    if (emailFromUrl) {
      document.getElementById("email").value = emailFromUrl;
    }

    function showMessage(text, type) {
      const box = document.getElementById("message");
      box.innerText = text;
      box.className = "message " + type;
    }

    async function verifyEmail() {
      const email = document.getElementById("email").value.trim();
      const code = document.getElementById("code").value.trim();

      if (!email) {
        showMessage("Please enter your email.", "error");
        return;
      }

      if (!code || code.length !== 6) {
        showMessage("Please enter the 6-digit verification code.", "error");
        return;
      }

      try {
        const res = await fetch(API + "/verify-email", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            code
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage(data.message || "Verification failed.", "error");
          return;
        }

        localStorage.setItem("luminaToken", data.token);
        localStorage.setItem("luminaUserId", data.user.id);
        localStorage.setItem("luminaName", data.user.fullName);
        localStorage.setItem("luminaEmail", data.user.email);
        localStorage.setItem("luminaBalance", data.user.balance);
        localStorage.setItem("luminaReferralCode", data.user.referralCode);
        localStorage.setItem("luminaReferralCount", data.user.referralCount || 0);
        localStorage.setItem("luminaActiveReferralCount", data.user.activeReferralCount || 0);
        localStorage.setItem("luminaPlan", data.user.plan || 0);
        localStorage.setItem("luminaPlanName", data.user.planName || "Free User");
        localStorage.setItem("luminaPlanActive", data.user.planActive ? "true" : "false");

        showMessage("Email verified successfully. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);

      } catch (error) {
        showMessage("Backend not reachable. Try again.", "error");
      }
    }

    async function resendCode() {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Please enter your email first.", "error");
        return;
      }

      try {
        const res = await fetch(API + "/resend-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage(data.message || "Could not resend code.", "error");
          return;
        }

        showMessage("New verification code sent to your email.", "success");

      } catch (error) {
        showMessage("Backend not reachable. Try again.", "error");
      }
    }
  </script>
</body>
</html>
